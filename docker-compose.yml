services:
  ml-service:
    build: ./ml-service
    container_name: frisk-ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - FRISK_API_KEY=${FRISK_API_KEY:-frisk-demo-key-2024}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
    volumes:
      - ml-artifacts:/app/model_artifacts
      - ml-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  backend:
    build: ./backend
    container_name: frisk-backend
    restart: unless-stopped
    ports:
      - "4001:4000"
    environment:
      - FRISK_API_KEY=${FRISK_API_KEY:-frisk-demo-key-2024}
      - ML_SERVICE_URL=http://ml-service:8000
      - NODE_ENV=production
    depends_on:
      ml-service:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frisk-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://backend:4000
    depends_on:
      - backend

volumes:
  ml-artifacts:
  ml-data:
